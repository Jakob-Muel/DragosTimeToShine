<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#70d6f2">
  <title>Drago's Time to Shine — Offline</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #70d6f2;
      color: #2f2140;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top))
        max(24px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));
      background:
        radial-gradient(circle at 18% 18%, #fff1c9 0 7%, transparent 7.5%),
        radial-gradient(circle at 82% 78%, #fff1c9 0 9%, transparent 9.5%),
        #70d6f2;
    }

    main {
      width: min(100%, 460px);
      padding: 34px 28px;
      text-align: center;
      background: #fffaf0;
      border: 5px solid #2f2140;
      border-radius: 24px;
      box-shadow: 0 10px 0 rgb(47 33 64 / 28%);
    }

    .dragon {
      display: block;
      margin-bottom: 8px;
      font-size: 72px;
      line-height: 1;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(26px, 8vw, 38px);
    }

    p {
      margin: 0;
      font-size: 18px;
      line-height: 1.5;
      color: #5c426a;
    }
  </style>
</head>
<body>
  <main>
    <span class="dragon" aria-hidden="true">🐉</span>
    <h1>Luma is napping</h1>
    <p>
      This part of the den is not available offline yet. Reconnect once,
      reopen the game, and Luma will be ready for your next visit.
    </p>
  </main>
</body>
</html>
