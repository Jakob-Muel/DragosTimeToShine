name: Test and deploy

# Tests and the web export check run on pull requests and on pushes to main (branch pushes
# without a PR are not built, which avoids running everything twice for an open PR).
# GitHub Pages deploys only from pushes to main. The PWA is a review channel; the product
# ships as native Android and iOS apps (docs/PRODUCT_DECISIONS.md D-10).

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.1-stable
  VERSION_BASE_COMMIT_COUNT: 3

jobs:
  test:
    name: Headless test suites
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out project
        uses: actions/checkout@v7

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/dragos-godot
            ~/.local/share/godot/export_templates/4.6.1.stable
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Download Godot 4.6.1
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: .github/scripts/install_godot.sh

      - name: Import project assets
        timeout-minutes: 10
        run: |
          "$HOME/.cache/dragos-godot/godot" \
            --headless --editor --import --path . --log-file /tmp/dragos-import.log

      - name: Run all headless suites
        timeout-minutes: 10
        env:
          SUITE_TIMEOUT: "120"
        run: GODOT="$HOME/.cache/dragos-godot/godot" tests/run_tests.sh

  build:
    name: Export web build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set build version from Git history
        shell: bash
        run: |
          set -euo pipefail
          commit_count="$(git rev-list --count HEAD)"
          build_number="$((commit_count - VERSION_BASE_COMMIT_COUNT))"
          if ((build_number < 1)); then
            build_number=1
          fi
          sed -i \
            "s/^const VERSION := .*/const VERSION := \"v0.${build_number}\"/" \
            scripts/build_info.gd
          grep -Fx "const VERSION := \"v0.${build_number}\"" scripts/build_info.gd

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/dragos-godot
            ~/.local/share/godot/export_templates/4.6.1.stable
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Download Godot 4.6.1
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: .github/scripts/install_godot.sh

      - name: Import project assets
        timeout-minutes: 10
        run: |
          "$HOME/.cache/dragos-godot/godot" \
            --headless --editor --import --path . --log-file /tmp/dragos-import.log

      - name: Export installable web app
        timeout-minutes: 10
        run: |
          mkdir -p build/web
          "$HOME/.cache/dragos-godot/godot" \
            --headless --path . \
            --export-release "Web PWA" build/web/index.html
          touch build/web/.nojekyll
          test -f build/web/index.html
          test -n "$(find build/web -maxdepth 1 -name '*.wasm' -print -quit)"
          test -n "$(find build/web -maxdepth 1 -name '*.service.worker.js' -print -quit)"

      - name: Package PWA for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          tar \
            --dereference \
            --hard-dereference \
            --directory build/web \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            .

      - name: Upload PWA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
